[package]
name = "simple_delaunay_lib"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Implementation of 2D and 3D Delaunay algorithms in Rust"
repository = "https://github.com/Ibujah/simple_delaunay_lib"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "simple_delaunay_lib"
path = "src/lib.rs"

[dependencies]
robust = "1.1.0"
anyhow = "1.0.66"
log="0.4.20"

[dev-dependencies]
env_logger="0.11.9"
nalgebra = "0.34.1"
rand = "0.10.0"
svg = "0.18.0"
ctor="0.6.3"

[[example]]
name = "delaunay_2d"
path = "example/delaunay_2d.rs"

[[example]]
name = "hilbert_curve_2d"
path = "example/hilbert_curve_2d.rs"

[[example]]
name = "computation_time_2d"
path = "example/computation_time_2d.rs"

[[example]]
name = "computation_time_3d"
path = "example/computation_time_3d.rs"

[lints.rust]
unused = "warn"
warnings = "warn"
unused_qualifications = "warn"
nonstandard_style = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"